services:
  matrix-tldr:
    build: .
    image: matrix-tldr:latest
    container_name: matrix-tldr
    restart: unless-stopped
    env_file: .env
    environment:
      # Im Container liegt der Store immer unter /app/store (Volume), unabhängig von der .env.
      MATRIX_STORE_PATH: /app/store
    volumes:
      # Crypto-Store und Session. Dieses Volume darf NIEMALS gelöscht werden (siehe README).
      - matrix-tldr-store:/app/store
    # Härtung
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    # Log-Rotation
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  matrix-tldr-store:
    name: matrix-tldr-store
